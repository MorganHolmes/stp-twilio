name: "[PR] Validate Variables/Documentation"

on:
  workflow_dispatch:
  pull_request:

jobs:
  validate:
    # The Validator action is not accessible outside of zingdevlimited.
    if: github.repository_owner == 'zingdevlimited'
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - uses: zingdevlimited/zing-documentation-validator@v1
        with:
          CONFIG_PATH: .github/validator.json
